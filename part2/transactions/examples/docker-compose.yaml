services:
    # PostgreSQL: The B-Tree / Heap / OLTP representative
    postgres-db:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: password
            POSTGRES_DB: acid_test
        ports:
            - "5432:5432"
        deploy:
            resources:
                limits:
                    memory: 512M
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d acid_test"]
            interval: 5s
            timeout: 5s
            retries: 5

    # ClickHouse: The LSM / MergeTree / OLAP representative
    clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
            - "8123:8123" # HTTP
            - "9000:9000" # Native client
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        deploy:
            resources:
                limits:
                    memory: 1G # ClickHouse needs slightly more RAM to start
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --spider -q http://localhost:8123/ping || exit 1",
                ]
            interval: 5s
            timeout: 5s
            retries: 5
